name: Monthly Bellingham Scrape

# The scrape itself runs on the Hetzner VPS (cron, 15th/16th 12:40 UTC) because
# police.cob.org TCP-resets GitHub Actions IPs. This workflow only VERIFIES the
# committed data's freshness afterward, so a stalled VPS cron still shows red here.

on:
  schedule:
    - cron: '0 14 15,16 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify data freshness (scraped on VPS)
        run: python scripts/verify_freshness.py bellingham/data/latest.json

      - name: Show results
        run: python -c "import json; d=json.load(open('bellingham/data/latest.json')); print(f'{len(d)} records, months {sorted(set((r[\"year\"],r[\"month\"]) for r in d))}')"
