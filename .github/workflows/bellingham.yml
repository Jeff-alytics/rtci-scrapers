name: Monthly Bellingham Scrape

on:
  schedule:
    - cron: '45 12 15,16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run scraper
        run: python bellingham/scrape.py

      - name: Verify data freshness
        working-directory: ${{ github.workspace }}
        run: python scripts/verify_freshness.py bellingham/data/latest.json

      - name: Show results
        run: python -c "import json; d=json.load(open('bellingham/data/latest.json')); print(f'{len(d)} records, months {sorted(set((r[\"year\"],r[\"month\"]) for r in d))}')"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bellingham/data/
          git diff --cached --quiet || git commit -m "Update Bellingham data $(date -u +%Y-%m-%d)"
          git pull --rebase origin master && git push
