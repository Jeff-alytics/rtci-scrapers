name: Monthly Missouri Scrape

on:
  schedule:
    - cron: '30 13 15,16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r missouri/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: xvfb-run python missouri/scrape.py

      - name: Verify data freshness
        working-directory: ${{ github.workspace }}
        run: python scripts/verify_freshness.py missouri/data/latest.json

      - name: Show results
        run: python -c "import json; d=json.load(open('missouri/data/latest.json')); print(f'{len(d)} records from {len(set(r[\"agency\"] for r in d))} agencies')"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add missouri/data/
          git diff --cached --quiet || git commit -m "Update Missouri data $(date -u +%Y-%m-%d)"
          git pull --rebase origin master && git push
