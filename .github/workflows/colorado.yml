name: Monthly Colorado Scrape

on:
  schedule:
    # 8 AM Central on the 15th (16th = backup). GitHub cron is UTC-only:
    # 13:00 UTC = 8 AM CDT (Mar-Nov), 14:00 UTC = 8 AM CST (Nov-Mar).
    - cron: '0 13 15,16 3-10 *'
    - cron: '0 14 15,16 11,12,1,2 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r colorado/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: xvfb-run python colorado/scrape.py

      - name: Verify data freshness
        working-directory: ${{ github.workspace }}
        run: python scripts/verify_freshness.py colorado/data/latest.json

      - name: Show results
        run: python -c "import json; d=json.load(open('colorado/data/latest.json')); print(f'{len(d)} records from {len(set(r[\"agency\"] for r in d))} agencies')"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add colorado/data/
          git diff --cached --quiet || git commit -m "Update Colorado data $(date -u +%Y-%m-%d)"
          git pull --rebase origin master && git push
