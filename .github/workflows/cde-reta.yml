name: Monthly CDE RETA Fetch

on:
  schedule:
    - cron: '0 13 15,16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r cde-reta/requirements.txt

      - name: Run RETA processor
        run: python cde-reta/fetch_reta.py

      - name: Verify data freshness
        run: python scripts/verify_freshness.py cde-reta/data/cde_reta_latest.csv

      - name: Show results
        run: |
          wc -l cde-reta/data/cde_reta_latest.csv
          head -5 cde-reta/data/cde_reta_latest.csv

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cde-reta/data/
          git diff --cached --quiet || git commit -m "Update CDE RETA data $(date -u +%Y-%m-%d)"
          git pull --rebase origin master && git push
