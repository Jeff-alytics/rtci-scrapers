name: Daily South Dakota Scrape

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r southdakota/requirements.txt

      - name: Run scraper
        run: python southdakota/scrape.py

      - name: Show results
        run: python -c "import json; d=json.load(open('southdakota/data/latest.json')); print(f'{len(d)} records from {len(set(r[\"agency\"] for r in d))} agencies')"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add southdakota/data/
          git diff --cached --quiet || git commit -m "Update South Dakota data $(date -u +%Y-%m-%d)"
          git pull --rebase origin master && git push
